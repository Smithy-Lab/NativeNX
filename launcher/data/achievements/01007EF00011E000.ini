# The Legend of Zelda: Breath of the Wild: achievements read from the save (game_data.sav, in each save slot).
# The list is WispyWoods' (posted on Reddit, r/Breath_of_the_Wild: 'Made a list of achievements that BotW would have'),
# the ones a save can show (riding a bear or a Lynel, getting lost in the Lost Woods, a one-hit kill with an ancient
# arrow, a full-recovery meal at a quarter heart, map completion, Selmie's Spot and the hot springs are not in it).
# The flags are the game's own names for them (its GameData, as the game's decompilation and
# MrCheeze's botw-tools have them), each checked to be one the game saves. 1000 points. See launcher/achieve.h for how
# a list is written.
title = The Legend of Zelda: Breath of the Wild
save = game_data.sav
format = flags32

# the Hyrule Compendium: an entry registered (a picture taken of it) sets its flag
