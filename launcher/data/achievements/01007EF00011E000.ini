# ---- the story ----
[paraglider]
name = The Paraglider
desc = Obtain the paraglider
points = 10
when = IsGet_PlayerStole2

[impa]
name = Meet Impa
desc = Find and talk to Impa
points = 5
when = Find_Impa_Finish

[tower_first]
name = The Tower
desc = Activate one Sheikah Tower
points = 5
when = count(MapTower_01..MapTower_15) >= 1

[towers_all]
name = The Full Map
desc = Activate every single Sheikah Tower
points = 15
when = count(MapTower_01..MapTower_15) >= 15

[beast_1]
name = The First Beast
desc = Free one Divine Beast
points = 10
when = Find_4Relic_1stClear

[beast_2]
name = The Second Beast
desc = Free two Divine Beasts
points = 15
when = Find_4Relic_2ndClear

[beast_3]
name = The Third Beast
desc = Free three Divine Beasts
points = 15
when = Find_4Relic_3rdClear

[beast_4]
name = The Final Beast
desc = Free all four Divine Beasts
points = 20
when = Find_4Relic_4thClear

[memory_1]
name = A Memory
desc = Find and play one memory
points = 5
when = count(IsPlayed_Demo126_0..IsPlayed_Demo138_0) >= 1

[memories_all]
name = I Remember...
desc = Get all 13 memories
points = 20
when = count(IsPlayed_Demo126_0..IsPlayed_Demo138_0) >= 13

[master_sword]
name = The Master Sword
desc = Pull out the Master Sword completely
points = 30
when = IsGet_Weapon_Sword_070

[hylian_shield]
name = The Hyrule Special
desc = Obtain the Hylian Shield
points = 15
when = IsGet_Weapon_Shield_030

[castle]
name = Inside The Castle
desc = Get inside Hyrule Castle
points = 15
when = count(Location_HyruleCastle_Hall_0..Location_HyruleCastle_Hall_2|Location_HyruleCastle_Room_0..Location_HyruleCastle_Room_11) >= 1

[ganon]
name = Defeat The Beast
desc = Beat Ganon
points = 60
hidden = 1
when = Defeated_Enemy_GanonBeast_Num >= 1

# ---- shrines ----
[shrine_60]
name = Shrines Half Done
desc = Complete 60 shrines
points = 15
when = count(Clear_Dungeon000..119) >= 60

[shrine_120]
