# General achievements: every game has these (NativeNX keeps the numbers: time played, screenshots, favourites).
# See launcher/achieve.h for how a list is written.

[first_steps]
name = First Steps
desc = Start the game on NativeNX
points = 5
when = launched

[hour_1]
name = Settling In
desc = Play for an hour
points = 10
when = playtime >= 1

[hours_10]
name = Getting Into It
desc = Play for 10 hours
points = 15
when = playtime >= 10

[hours_50]
name = Devoted
desc = Play for 50 hours
points = 25
when = playtime >= 50

[hours_100]
name = Centurion
desc = Play for 100 hours
points = 40
when = playtime >= 100

[screenshot_1]
name = Say Cheese
desc = Take a screenshot (F12)
points = 5
when = screenshots >= 1

[screenshots_25]
name = Photographer
desc = Take 25 screenshots
points = 10
when = screenshots >= 25

[favourite]
name = One of the Greats
desc = Make the game a favourite
points = 5
when = favourite
