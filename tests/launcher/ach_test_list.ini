# a test list for the made-up library's Ocean Song (program 0100AAAA00060000), saved by fake_nxlinux_ach.py
title = Ocean Song
save = test.sav
format = flags32

[shells]
name = Shell Collector
desc = Find 3 shells
points = 20
when = Shells >= 3

[kraken]
name = Deep Trouble
desc = Beat the kraken
points = 50
when = Kraken_Defeated

[ghost]
name = Ghost Flag
desc = A flag no save has
points = 10
when = No_Such_Flag
